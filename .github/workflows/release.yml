name: Release

# 发版触发方式（三种任选）：
#   1. 改好版本号推到 main —— 版本号和上次发过的不同才会发版（推荐日常用法）
#   2. 直接推 tag，例如：git tag v2.0.8 && git push origin v2.0.8
#   3. 在 Actions 页面手动 Run workflow（可勾选强制重发同一版本）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "版本已发布过也强制重新发布"
        type: boolean
        default: false

# 创建 Release / 上传产物需要写权限
permissions:
  contents: write

# 同一个分支/标签的发版任务排队执行，避免两个 Release 抢同一个 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. 读版本号，判断这次要不要发版 ───────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
      release_state: ${{ steps.meta.outputs.release_state }}
    steps:
      - uses: actions/checkout@v5

      - name: 校验版本号并判断是否需要发版
        id: meta
        env:
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          if [ "$pkg" != "$version" ] || [ "$cargo" != "$version" ]; then
            echo "::error::三处版本号不一致：tauri.conf.json=$version / package.json=$pkg / Cargo.toml=$cargo。" \
                 "先执行 pnpm version:bump $version 对齐后再提交。"
            exit 1
          fi

          tag="v$version"
          # tag 触发时，tag 名必须和代码里的版本号一致，否则会发出一个版本号对不上的 Release
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME:-} 与代码里的版本 $tag 不一致，请先对齐版本号再打 tag。"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "由 tag ${GITHUB_REF_NAME:-} 触发，开始发版"
          elif [ "${FORCE:-}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "手动强制发版 $tag"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$tag 已经有 Release 了：这次只改了代码没改版本号，跳过发版"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "发现新版本 $tag，开始构建"
          fi

          # 同名 Release 的状态，决定构建时新建草稿还是原地更新（见 tauri-action 步骤）：
          #   draft     上次发版中断留下的草稿，继续往里补产物
          #   published 版本已正式发布（强制重发场景），产物直接更新到它上面
          #   none      全新版本
          has_draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft == true and .tag_name == \"$tag\") | .tag_name")
          if [ -n "$has_draft" ]; then
            echo "release_state=draft" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_state=published" >> "$GITHUB_OUTPUT"
          else
            echo "release_state=none" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 构建 Windows 安装包 + 便携版 + 自动更新包，并发布 ──────────
  release:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 生成更新日志要读两个 tag 之间的提交，需要完整历史
          fetch-depth: 0

      # pnpm 必须装在 setup-node 之前，setup-node 的 pnpm 缓存才能生效
      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 自动更新包必须用私钥签名，客户端才会安装。
      # 这里先拿一个临时文件试签一次：密钥/密码有问题就早点说清楚，
      # 不至于等二十多分钟编译完才报错；没配好则只出安装包并给警告。
      - name: 检查自动更新的签名配置
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw
          $reason = $null

          if ($config -match 'REPLACE_WITH_YOUR_UPDATER_PUBLIC_KEY') {
            $reason = "tauri.conf.json 里的 updater.pubkey 还是占位符（需要填入 tauri signer generate 输出的公钥）"
          } elseif ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            $reason = "未配置 TAURI_SIGNING_PRIVATE_KEY 密钥"
          } else {
            Set-Content -Path signing-check.txt -Value "xpaste signing self check" -Encoding ascii
            pnpm tauri signer sign signing-check.txt *> $null
            if ($LASTEXITCODE -ne 0) {
              $reason = "私钥或密码不可用，请检查 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD 两个 Secret"
            }
            Remove-Item signing-check.txt, signing-check.txt.sig -ErrorAction SilentlyContinue
          }

          if ($reason) {
            Write-Warning "本次不生成自动更新包：$reason。已安装的客户端将收不到更新提示，配置方法见 README「自动更新」一节。"
            "has_signing=false" >> $env:GITHUB_OUTPUT
            "args=--bundles nsis" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "签名配置就绪，将同时生成安装包与自动更新包（latest.json）"
            "has_signing=true" >> $env:GITHUB_OUTPUT
            'args=--bundles nsis --config {"bundle":{"createUpdaterArtifacts":true}}' >> $env:GITHUB_OUTPUT
          }

      # 更新日志：优先用 release-notes/<版本>.md（手写，质量更好），
      # 没有就调用 scripts/gen-release-notes.mjs 按「上次发版 tag → HEAD」的提交结构化生成
      - name: 准备更新日志
        id: notes
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $tag = "${{ needs.version.outputs.tag }}"
          $noteFile = "release-notes/$version.md"

          if (Test-Path $noteFile) {
            $body = (Get-Content $noteFile -Raw -Encoding UTF8).Trim()
            Write-Host "使用 $noteFile 作为更新日志"
          } else {
            $generated = node scripts/gen-release-notes.mjs --version $version --to HEAD --stdout
            if ($LASTEXITCODE -ne 0) { throw "自动生成更新日志失败（$noteFile 不存在，且无法按提交记录生成）" }
            $body = ($generated | Out-String).Trim()
            Write-Host "没有找到 $noteFile，已按提交记录自动生成更新日志"
          }

          "body<<__NOTES_EOF__" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "__NOTES_EOF__" >> $env:GITHUB_OUTPUT

      # tauri-action 执行 tauri build：先把 Release 建成草稿并挂上安装包，
      # 生成更新日志后再一次性正式发布
      - name: 构建并上传安装包到 Release（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          # 版本已正式发布过（强制重发）时原地更新产物；否则新建草稿，发完由 publish 转正
          releaseDraft: ${{ needs.version.outputs.release_state != 'published' }}
          prerelease: false
          args: ${{ steps.signing.outputs.args }}
          includeUpdaterJson: ${{ steps.signing.outputs.has_signing }}

      # tauri-action@v0 复用已有 Release（强制重发）时只补产物，不更新标题与说明；
      # 这里显式改成最新的标题和日志。新版 action 自带该逻辑，升级后可删此步。
      - name: 更新 Release 标题与说明
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          XP_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          Set-Content -Path release-notes-final.md -Value $env:XP_NOTES -Encoding utf8
          gh release edit $env:TAG --title "v${{ needs.version.outputs.version }}" --notes-file release-notes-final.md
          Remove-Item release-notes-final.md

      # 让应用内"发现新版本"弹窗能显示更新日志：把说明同步进 latest.json
      # 这一步失败不影响发版，只警告
      - name: 同步更新日志到 latest.json
        if: steps.signing.outputs.has_signing == 'true'
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          try {
            $body = gh release view $tag --json body -q .body
            gh release download $tag -p latest.json --clobber
            $env:XP_NOTES = $body
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('latest.json','utf8'));j.notes=process.env.XP_NOTES||j.notes||'';fs.writeFileSync('latest.json',JSON.stringify(j,null,2)+'\n')"
            gh release upload $tag latest.json --clobber
            Write-Host "latest.json 已带上更新日志"
          } catch {
            Write-Warning "同步更新日志到 latest.json 失败（不影响发版）：$_"
          }

      - name: 打包便携版 zip
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/paste_app.exe"
          if (-not (Test-Path $exe)) { throw "找不到编译产物：$exe" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe portable/Xpaste.exe
          Compress-Archive -Path portable/Xpaste.exe `
            -DestinationPath "Xpaste_v${{ needs.version.outputs.version }}_portable_win_x64.zip" -Force

      - name: 上传便携版
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" `
            "Xpaste_v${{ needs.version.outputs.version }}_portable_win_x64.zip" --clobber

  # ── 3. 收尾：等 macOS 也挂完产物后再把草稿转正 ─────────────────────
  #
  # 转正必须放在两个平台都上传完之后，否则 macOS 的 dmg 会挂到已发布的
  # Release 上。这里用 always() 保证 macOS 失败时 Windows 版照样能发出去。
  publish:
    needs: [version, release, release-macos]
    if: always() && needs.version.outputs.should_release == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 汇总构建结果
        id: summary
        shell: bash
        run: |
          macos_state="${{ needs.release-macos.result }}"
          echo "windows=success" >> "$GITHUB_OUTPUT"
          echo "macos=$macos_state" >> "$GITHUB_OUTPUT"
          if [ "$macos_state" = "skipped" ]; then
            echo "本次未构建 macOS 产物"
          elif [ "$macos_state" = "failure" ]; then
            echo "::warning title=macOS 构建失败::Windows 版正常发布，但没有 dmg。请到 Actions 日志查看原因，常见情况是 Apple 签名或公证未配置。"
          fi

      - name: 正式发布
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # 注意：草稿 Release 还没有关联 tag，releases/tags/$TAG 查不到，
          # 只能从列表里按 tag_name 匹配本次版本创建的草稿。
          id=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            # 强制重发已发布的版本时没有草稿，产物已原地更新到正式 Release 上
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG 已是正式状态，本次构建产物已原地更新"
              exit 0
            fi
            echo "::error::找不到 tag 为 $TAG 的草稿 Release"
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false > /dev/null
          echo "已发布：$(gh release view "$TAG" --json url -q .url)"

  # ── 3. 构建 macOS dmg（双架构并行：Intel x64 + Apple Silicon ARM64）──────────────────────
  #
  # 与 Windows job 并行：两边都往同一个草稿 Release 上挂产物，
  # 谁先建草稿都行，后到的直接追加资源（tauri-action 会复用已存在的 Release）。
  # macOS 没有免安装的便携版概念，这里只出 dmg 与 .app.tar.gz 自动更新包。
  # 使用 matrix 并行在 macos-13 (Intel) 和 macos-15 (ARM64/M系列) 上分别构建。
  release-macos:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            arch_label: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch_label: arm64
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # 使用 matrix 指定的目标架构，避免 runner.arch 判断带来的不确定性
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.arch_label }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 更新日志沿用同一份内容：优先 release-notes/<版本>.md，否则按提交记录生成。
      # 这里不负责发布 Release，只取文本供 tauri-action 复用。
      - name: 准备更新日志
        id: notes
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          noteFile="release-notes/$version.md"
          if [ -f "$noteFile" ]; then
            body=$(cat "$noteFile")
            echo "使用 $noteFile 作为更新日志"
          else
            body=$(node scripts/gen-release-notes.mjs --version "$version" --to HEAD --stdout)
            if [ $? -ne 0 ]; then
              echo "::error::自动生成更新日志失败（$noteFile 不存在，且无法按提交记录生成）"
              exit 1
            fi
            echo "没有找到 $noteFile，已按提交记录自动生成更新日志"
          fi
          {
            echo "body<<__NOTES_EOF__"
            echo "$body"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # macOS 未配置签名时也要能出包：没有公证凭据则只出 dmg 并警告。
      # 一旦配置了 APPLE_CERTIFICATE 等Secret，就同时产出自动更新包并做公证。
      # 只有 ARM64 (M系列) 构建启用自动更新产物，避免 x86_64 与 ARM64 的 latest.json / .app.tar.gz 冲突。
      - name: 检查 macOS 签名与公证配置
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--bundles dmg)
          updater=false
          # 只有 ARM64 架构且配置了签名证书时才生成自动更新产物
          enable_updater=false
          if [ "${{ matrix.arch_label }}" = "arm64" ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            enable_updater=true
          fi

          if [ "$enable_updater" = "true" ]; then
            # 有开发者证书：正式签名 +公证，同时产出自动更新包
            echo "Apple签名配置就绪 (ARM64)，将签名、公证并生成 .app.tar.gz 自动更新包"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
            updater=true
            # 把 Apple 签名/公证变量转写给后面的构建步骤（GITHUB_ENV 对之后所有步骤生效）。
            # 只在配置了证书时才转写：tauri-bundler 只要看到
            # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD 两个变量存在，
            # 哪怕值是空字符串也会去走 security import 导入证书，
            # 空证书会直接报 SecKeychainItemImport 错误，ad-hoc 分支就挂了。
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              {
                echo "$name<<__APPLE_ENV_EOF__"
                printf '%s\n' "${!name}"
                echo "__APPLE_ENV_EOF__"
              } >> "$GITHUB_ENV"
            done
          else
            # 没有证书或非 ARM64：用 ad-hoc 签名保证 dmg 能直接打开，代价是用户需手动放行 Gatekeeper
            if [ "${{ matrix.arch_label }}" = "arm64" ]; then
              echo "::warning::未配置 Apple 开发者签名（APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY），ARM64 构建使用 ad-hoc 签名。用户首次打开需在 系统设置 - 隐私与安全性 中点仍要打开。"
            else
              echo "x86_64 构建使用 ad-hoc 签名（不生成自动更新产物，避免与 ARM64 的 latest.json 冲突）"
            fi
            args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
          fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"

      - name: 构建并上传 dmg（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple 签名/公证变量不能在这里无条件引用 secrets：未配置 Secret 时
          # 那样会设成空字符串变量，tauri-bundler 看到变量存在就会走证书导入然后报错。
          # 配置齐全时由上面「检查 macOS 签名与公证配置」一步按条件写入 GITHUB_ENV 传入。
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "v${{ needs.version.outputs.version }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # 版本已正式发布过（强制重发）时原地追加产物；否则挂到草稿上，由 publish 转正
          releaseDraft: ${{ needs.version.outputs.release_state != 'published' }}
          prerelease: false
          args: ${{ steps.signing.outputs.args }}
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
