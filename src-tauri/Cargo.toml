[package]
name = "paste_app"
version = "2.0.11"
description = "Clipboard history manager"
authors = ["lanjian"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri 相关 crate 统一钉在 2.12：不能用 "2" 通配。
# CI 用 dtolnay/rust-toolchain@stable 装工具链，通配会让 Rust 侧漂到最新，
# 而 npm侧的 @tauri-apps/api 由 lock 文件固定，两边一旦错位，
# tauri build 会直接报 "Found version mismatched Tauri packages" 而中断发版。
[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-shell = "2.5"
# 自动更新：检查更新、下载并校验签名、执行安装
tauri-plugin-updater = "2.13"
# 更新安装后重启应用
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
arboard = "3"
regex = "1"
image = "0.25"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "paste_app"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# ── Windows 专属：低级键盘钩子、剪贴板监听、光标与前台窗口 API ──────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
